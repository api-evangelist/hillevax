name: HilleVax
description: >-
  HilleVax was a clinical-stage biopharmaceutical company focused on developing
  and commercializing novel vaccines, most notably HIL-214, a virus-like-particle
  based vaccine candidate aimed at preventing moderate-to-severe acute
  gastroenteritis caused by norovirus infection. The company was surfaced in the
  API Evangelist network as a portfolio company of Lightspeed Venture Partners.
  Enrichment probing found no developer program, no API, no developer portal, and
  no public API documentation of any kind, which is expected for a clinical-stage
  vaccine developer rather than a technology/API producer. The company's primary
  domain (hillevax.com) now redirects to xoma.com (XOMA Royalty), indicating
  HilleVax has been acquired and wound down as an independent operating company;
  XOMA Royalty itself was subsequently acquired by Ligand (closed July 2026).
  This profile is retained as a company/identity record with no API surface.
